[%General]
DBFileExtensions=SQLite database files (*.db *.sqlite *.sqlite3 *.db3)
appStyle=0
fontsize=12
language=en_US
maxRecentFiles=5
promptsqltabsinnewproject=true
recentFileList=@Invalid()
toolbarStyle=2
toolbarStyleBrowse=0
toolbarStyleEditCell=0
toolbarStyleSql=0
toolbarStyleStructure=2

[MainWindow]
geometry=
openTabs=structure browser pragmas query
windowState=

[SQLLogDock]
Log=Application

[SchemaDock]
dropEnquotedNames=false
dropQualifiedNames=true
dropSelectQuery=true

[checkversion]
enabled=true

[databrowser]
bin_bg_colour=@Variant(\0\0\0\x43\x1\xff\xff\xff\xff\xff\xff\xff\xff\0\0)
bin_fg_colour=@Variant(\0\0\0\x43\x1\xff\xff\xc0\xc0\xc0\xc0\xc0\xc0\0\0)
blob_text=BLOB
complete_threshold=1000
filter_delay=200
filter_escape=\\
font=Hack
fontsize=12
formatted_bg_colour=@Variant(\0\0\0\x43\x1\xff\xff\xf8\xf8\xf8\xf8\xf8\xf8\0\0)
formatted_fg_colour=@Variant(\0\0\0\x43\x1\xff\xff\x44\x44\x44\x44\x44\x44\0\0)
image_preview=false
null_bg_colour=@Variant(\0\0\0\x43\x1\xff\xff\xff\xff\xff\xff\xff\xff\0\0)
null_fg_colour=@Variant(\0\0\0\x43\x1\xff\xff\xc0\xc0\xc0\xc0\xc0\xc0\0\0)
null_text=NULL
reg_bg_colour=@Variant(\0\0\0\x43\x1\xff\xff\xff\xff\xff\xff\xff\xff\0\0)
reg_fg_colour=@Variant(\0\0\0\x43\x1\xff\xff\x44\x44\x44\x44\x44\x44\0\0)
symbol_limit=5000

[db]
defaultencoding=UTF-8
defaultfieldtype=0
defaultlocation=/home/brent
defaultsqltext=
fontsize=12
foreignkeys=true
hideschemalinebreaks=true
prefetchsize=50000
savedefaultlocation=2

[editor]
auto_completion=true
close_button_on_tabs=true
error_indicators=true
font=Hack
fontsize=12
horizontal_tiling=false
identifier_quotes=0
indentation_use_tabs=false
splitter1_sizes=@Invalid()
splitter2_sizes=@Invalid()
tabsize=4
upper_keywords=true
wrap_lines=0

[extensions]
builtin=@Variant(\0\0\0\b\0\0\0\0)
disableregex=false
enable_load_extension=false
list=@Invalid()

[log]
fontsize=11

[proxy]
authentication=false
host=
password=
port=1
type=system
user=

[remote]
active=true
client_certificates=@Invalid()
clonedirectory=/home/brent/.local/share/sqlitebrowser/DB Browser for SQLite

